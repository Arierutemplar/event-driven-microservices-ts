apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: analytics
spec:
  replicas: 1
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports: [{containerPort: 5432}]
          env:
            - {name: POSTGRES_DB, value: analytics}
            - {name: POSTGRES_USER, value: postgres}
            - {name: POSTGRES_PASSWORD, value: local-postgres-password}
          readinessProbe:
            exec: {command: ["pg_isready", "-U", "postgres", "-d", "analytics"]}
            periodSeconds: 5
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
      volumes: [{name: data, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: analytics
spec:
  selector: {app: postgres}
  ports: [{port: 5432}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: analytics
spec:
  replicas: 1
  selector:
    matchLabels: {app: redis}
  template:
    metadata:
      labels: {app: redis}
    spec:
      containers:
        - name: redis
          image: redis:8-alpine
          args: ["--requirepass", "local-redis-password"]
          ports: [{containerPort: 6379}]
          readinessProbe:
            exec: {command: ["sh", "-c", "redis-cli -a local-redis-password ping | grep PONG"]}
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: analytics
spec:
  selector: {app: redis}
  ports: [{port: 6379}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nats
  namespace: analytics
spec:
  replicas: 1
  selector:
    matchLabels: {app: nats}
  template:
    metadata:
      labels: {app: nats}
    spec:
      containers:
        - name: nats
          image: nats:2-alpine
          args: ["-js", "-sd", "/data", "-m", "8222"]
          ports: [{containerPort: 4222}, {containerPort: 8222}]
          readinessProbe:
            httpGet: {path: "/healthz?js-enabled-only=true", port: 8222}
            periodSeconds: 5
          volumeMounts: [{name: data, mountPath: /data}]
      volumes: [{name: data, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata:
  name: nats
  namespace: analytics
spec:
  selector: {app: nats}
  ports: [{name: client, port: 4222}]
