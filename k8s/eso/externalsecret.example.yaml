apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: analytics-secrets
  namespace: analytics
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: analytics-vault
    kind: SecretStore
  target:
    name: analytics-secrets
    creationPolicy: Owner
  data:
    - secretKey: API_KEY
      remoteRef:
        key: analytics/backend
        property: api_key
    - secretKey: WS_TICKET_SECRET
      remoteRef:
        key: analytics/backend
        property: ws_ticket_secret
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: analytics/backend
        property: postgres_password
    - secretKey: NATS_URL
      remoteRef:
        key: analytics/backend
        property: nats_url
    - secretKey: REDIS_URL
      remoteRef:
        key: analytics/backend
        property: redis_url
