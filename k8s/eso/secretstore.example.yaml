apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: analytics-vault
  namespace: analytics
spec:
  provider:
    vault:
      server: https://vault.example.com:8200
      path: kv
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: analytics-eso
          serviceAccountRef:
            name: analytics-eso-vault
            audiences:
              - vault
