apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: analytics-backend-ingress
  namespace: analytics
spec:
  podSelector:
    matchLabels:
      app: analytics-backend
  policyTypes:
    - Ingress
  ingress:
    # Adjust the namespace labels to match your ingress controller and Prometheus installation.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8080
