apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: analytics-backend-egress
  namespace: analytics
spec:
  podSelector:
    matchLabels:
      app: analytics-backend
  policyTypes:
    - Egress
  egress:
    # DNS
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # PostgreSQL, Redis, NATS, S3/Vault/OTLP over TLS, OTLP gRPC/HTTP.
    # Destinations are intentionally port-scoped only: tighten them with `to:` selectors for
    # your datastore namespaces / CIDRs in an overlay (see k8s/README.md).
    - ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 6379
        - protocol: TCP
          port: 4222
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 4317
        - protocol: TCP
          port: 4318
