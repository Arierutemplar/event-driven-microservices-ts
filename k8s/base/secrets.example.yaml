apiVersion: v1
kind: Secret
metadata:
  name: analytics-secrets
  namespace: analytics
type: Opaque
stringData:
  API_KEY: replace-with-external-secret
  WS_TOKEN: replace-with-external-secret
  TENANT_API_KEYS: replace-with-external-secret
  POSTGRES_HOST: postgres.example.internal
  POSTGRES_USER: analytics
  POSTGRES_PASSWORD: replace-with-external-secret
  POSTGRES_DB: analytics
  NATS_URL: nats://nats.example.internal:4222
  REDIS_URL: redis://:replace-with-external-secret@redis.example.internal:6379/0
