apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
  - serviceaccount.yaml
patches:
  - path: deployment-patch.yaml
  # Secrets come from Vault Agent files, not from the ESO-managed Secret: drop that envFrom entry.
  - target:
      kind: Deployment
      name: analytics-backend
    patch: |-
      - op: test
        path: /spec/template/spec/containers/0/envFrom/1/secretRef/name
        value: analytics-secrets
      - op: remove
        path: /spec/template/spec/containers/0/envFrom/1
