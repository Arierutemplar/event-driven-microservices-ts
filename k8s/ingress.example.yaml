apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: analytics
  namespace: analytics
spec:
  ingressClassName: REPLACE_WITH_INGRESS_CLASS
  tls:
    - hosts:
        - analytics.example.com
      secretName: analytics-ingress-tls
  rules:
    - host: analytics.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: analytics-backend
                port:
                  number: 8080
